name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Module isolation guard
        run: node scripts/check-module-imports.mjs
      - name: Build library (tsc + vite)
        run: npm run build:lib
      - name: Tests
        run: npm test
